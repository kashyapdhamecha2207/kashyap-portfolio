[build]
  command = "npm run build"
  publish = "dist"

# Proxy LeetCode GraphQL to avoid CORS (mirrored in vite.config.ts for dev)
[[redirects]]
  from = "/api/leetcode"
  to = "https://leetcode.com/graphql"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
